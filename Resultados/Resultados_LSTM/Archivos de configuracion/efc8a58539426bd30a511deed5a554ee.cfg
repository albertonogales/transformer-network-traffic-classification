# -----------------------------------------------------------------------------------------
# -----------------------------------------------------------------------------------------
# ---------ARCHIVO DE CONFIGURACIÓN DEL ENTRENAMIENTO DE UNA LSTM DE CLASIFICACIÓN---------
# -----------------------------------------------------------------------------------------
# -----------------------------------------------------------------------------------------


# -----------------------------------------------------------------------------------------
# ----------------------------------OPCIONES DE EJECUCIÓN----------------------------------
# -----------------------------------------------------------------------------------------
# En las primeras opciones podemos elegir "True" o "False"
# En hashSemiflujos hay que elegir el nombre de un hash de semiflujos existente en el
# directorio que elijamos como "rutaSemiflujos" en el apartado de rutas
# Para más información de cada uno de los modos de ejecución, consultar el jupyter notebook
# del modelo LSTM, en el apartado de "Opciones de ejecución e hiperparámetros"
# -----------------------------------------------------------------------------------------
[OpcionesEjecucion]
cargar_pesos = False
guardar_pesos = True
guardar_resultados = True
hashSemiflujos = 7be2a6d0f3592295547184340b68b4b4


# -----------------------------------------------------------------------------------------
# -----------------------------HIPERPARÁMETROS DEL MODELO----------------------------------
# -----------------------------------------------------------------------------------------
# num_capas_lstm --> Número de capas LSTM a incluir en el modelo
# hidden_state --> Dimensionalidad del estado oculto de una capa LSTM
# mlp_units --> Número de neuronas de la capa 'dense' que hay a la salida de la capa LSTM
# lstm_dropout --> Tasa de dropout a aplicar al final de la capa LSTM
# mlp_dropout --> Tasa de dropout a aplicar en la capa MLP
# epochs --> Número de épocas a entrenar el modelo 
# batch_size --> Tamaño del lote de entrenamiento 
# learning_rate --> Tasa de aprendizaje a aplicar en el entrenamiento
# num_folds --> Número de folds a usar en el KFold (se recomienda 5 ó 10)
# normalizar --> Si es 'True' se normalizan los datos de los semiflujos 
# -----------------------------------------------------------------------------------------
[Hiperparametros]
num_capas_lstm = 2
hidden_state = 75
mlp_units = 100
lstm_dropout = 0.25
mlp_dropout = 0.25
epochs = 20
batch_size = 10000
learning_rate = 1e-4
num_folds = 5
normalizar = False


# -----------------------------------------------------------------------------------------
# -----------------------------RUTAS DEL ENTRENAMIENTO-------------------------------------
# -----------------------------------------------------------------------------------------
# Rutas relativas desde la raíz del proyecto
# ¡¡WARNING!! PONER UNA BARRA AL FINAL DE LA RUTA
# -----------------------------------------------------------------------------------------
[RutasArchivos]
pathRelativoPesos = Objetos preprocesados/Pesos_LSTM/
rutaSemiflujos =  Objetos preprocesados/Semiflujos/
rutaResultados = Resultados/Resultados_LSTM/
