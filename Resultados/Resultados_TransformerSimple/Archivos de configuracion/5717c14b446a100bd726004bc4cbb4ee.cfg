# -----------------------------------------------------------------------------------------
# -----------------------------------------------------------------------------------------
# ------ARCHIVO DE CONFIGURACIÓN DEL ENTRENAMIENTO DE UN TRANSFORMER DE CLASIFICACIÓN------
# -----------------------------------------------------------------------------------------
# -----------------------------------------------------------------------------------------


# -----------------------------------------------------------------------------------------
# ----------------------------------OPCIONES DE EJECUCIÓN----------------------------------
# -----------------------------------------------------------------------------------------
# En las primeras opciones podemos elegir "True" o "False"
# En hashSemiflujos hay que elegir el nombre de un hash de semiflujos existente en el
# directorio que elijamos como "rutaSemiflujos" en el apartado de rutas
# Para más información de cada uno de los modos de ejecución, consultar el jupyter notebook
# del modelo transformer, en el apartado de "Opciones de ejecución e hiperparámetros"
# -----------------------------------------------------------------------------------------
[OpcionesEjecucion]
cargar_pesos = False
guardar_pesos = True
guardar_resultados = True
hashSemiflujos = 7be2a6d0f3592295547184340b68b4b4


# -----------------------------------------------------------------------------------------
# -----------------------------HIPERPARÁMETROS DEL MODELO----------------------------------
# -----------------------------------------------------------------------------------------
# epochs --> Número de épocas a entrenar el modelo
# batch_size --> Tamaño del lote de entrenamiento
# learning_rate --> Tasa de aprendizaje a aplicar en el entrenamiento
# positional_encoding --> Si es 'True' aplica positional enconding al transformer
# num_heads --> Número de cabezas del encoder del transformer
# head_size --> Tamaño de cada cabeza
# mlp_units --> Número de neuronas de la capa 'dense' que hay a la salida del transformer
# ff_dim --> Número de filtros del Feed Forward del encoder
# mlp_dropout --> Tasa de dropout a aplicar en la capa MLP
# dropout --> Tasa de dropout a aplicar en el encoder del transformer
# num_capas_atencion --> Número de capas encoder del transformer
# num_folds --> Número de folds a usar en el KFold (se recomienda 5 ó 10)
# normalizar --> Si es 'True' se normalizan los datos de los semiflujos 
# -----------------------------------------------------------------------------------------
[Hiperparametros]
epochs = 20
batch_size = 100
learning_rate = 3e-4
positional_encoding = False
num_heads = 8
head_size = 6
mlp_units = 250
ff_dim = 256
mlp_dropout= 0.2
dropout= 0.2
num_capas_atencion = 1
num_folds = 5
normalizar = True


# -----------------------------------------------------------------------------------------
# -----------------------------RUTAS DEL ENTRENAMIENTO-------------------------------------
# -----------------------------------------------------------------------------------------
# Rutas relativas desde la raiz del proyecto
# ¡¡WARNING!! PONER UNA BARRA AL FINAL DE LA RUTA
# -----------------------------------------------------------------------------------------
[RutasArchivos]
pathRelativoPesos = Objetos preprocesados/Pesos_TransformerSimple/
rutaSemiflujos =  Objetos preprocesados/Semiflujos/
rutaResultados = Resultados/Resultados_TransformerSimple/
