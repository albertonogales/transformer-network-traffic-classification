# -----------------------------------------------------------------------------------------
# ----------------------------------OPCIONES DE EJECUCIÓN----------------------------------
# -----------------------------------------------------------------------------------------
# Opciones de ejecucion, podemos elegir "True" o "False"
# Para más información de cada uno de los modos de ejecución, consultar el jupyter notebook
# del preprocesamiento, en el apartado de "Opciones de ejecución e hiperparámetros"
# -----------------------------------------------------------------------------------------
[OpcionesEjecucion]
generar_ficheros_csv = True
generar_dfs = True


# -----------------------------------------------------------------------------------------
# -----------------------HIPERPARÁMETROS DEL PREPROCESAMIENTO------------------------------
# -----------------------------------------------------------------------------------------
# En el caso de "categorias_a_procesar" debemos escribir aquellas que queramos procesar, separadas por un espacio.
# Ej procesando todas las del dataset Canadiense: Chat Email FileTransfer Streaming VoIP
# Ej con grabaciones 5G: Audio_5G Chat_fotos_5G Chat_texto_5G FileTransfer_5G Instagram_5G Maps_5G Streaming_5G Videojuego_5G
#
# min_paquetes_flujo --> Indica cuál debe ser el mínimo de paquetes de un flujo, con menos será desechado, ya que se entiende
#                         que es demasiado corto y por tanto no es relevante para poder aportar información.
#
# tiempo_maximo_semiflujo --> Máximo de tiempo que puede pasar entre el primer paquete de un semiflujo y el último, si no se
#                             cumple se entiende que se ha roto la relación entre dichos paquetes y no es un semiflujo válido.
#
# num_paquetes_semiflujo --> Número de paquetes que conformará un semiflujo, si no llega se desecha. Cuando llega al tamaño
#                            indicado el semiflujo se completa, guardándolo y empezando uno nuevo con el siguiente paquete
#                            del flujo.
#
# longitud_raw --> Longitud fija a la que se truncará el contenido RAW del paquete, es decir, su TCPpayload o su UDPpayload, se
#                  realizará padding con ceros en caso de que este no llegue a la longitud. 
#
# num_hex_token --> Número de caracteres hexadecimales que tendrá cada uno de los tokens en los que se dividirá el contenido
#                   raw del paquete. Con 4, los tokens serán de la forma 'XXXX', siendo X un carácter hexadecimal.
#
# token_separador --> Estrategia a seguir a la hora de decidir cómo es el token separador de fin de paquete.
#                     De momento solo se permite la opción de 'num_máximo', que pone el número más grande posible, como token.
#                     Para un 'num_hex_token' = 4, esto sería 'FFFF'
# -----------------------------------------------------------------------------------------
[Hiperparametros]
# TransferenciaArchivos YouTube Spotify Discord
categorias_a_procesar = Chat Email FileTransfer Streaming VoIP
min_paquetes_flujo = 20
tiempo_maximo_semiflujo = 30.0
num_paquetes_semiflujo = 20
longitud_raw = 800
num_hex_token = 4
token_separador = num_maximo


