# -----------------------------------------------------------------------------------------
# -----------------------------------------------------------------------------------------
# --------------ARCHIVO DE CONFIGURACIÓN DE LA CLASIFICACIÓN EN TIEMPO REAL----------------
# -----------------------------------------------------------------------------------------
# -----------------------------------------------------------------------------------------


# -----------------------------------------------------------------------------------------
# ----------------------------------OPCIONES DE EJECUCIÓN----------------------------------
# -----------------------------------------------------------------------------------------
# tipo_modelo                -->  Indica el modelo de clasificación que será utilizado 
#                                 Actualmente existe el Transformer (XFMR) y el LSTM
# hash_pesos_modelo          -->  Indica el hash del modelo cuyos pesos queremos cargar 
# hash_pesos_semiflujos      -->  Indica el hash de los semiflujos usados para entrenar el 
#                                 modelo cuyos pesos queremos cargar. (Debe existir la combinación 
#                                 de modelo y semiflujos en el directorio de pesos correspondiente)
# -----------------------------------------------------------------------------------------
[OpcionesEjecucion]
tipo_modelo = XFMR
hash_pesos_modelo = fe693df6778a35ca5a920dfa73b35b69
hash_pesos_semiflujos = 060eaab55e1e0dd2d41fe88ed69ebb5b

# -----------------------------------------------------------------------------------------
# -----------------------------HIPERPARÁMETROS DEL MODELO----------------------------------
# -----------------------------------------------------------------------------------------
# tiempo_captura_pcap --> Número de segundos de cada archivo PCAP que capturará el programa
#                         Transcurrido estos segundos, el programa generar un PCAP y comienza
#                         a grabar uno nuevo
# 
# 
# -----------------------------------------------------------------------------------------
[Hiperparametros]
tiempo_captura_pcap = 8.0



# -----------------------------------------------------------------------------------------
# -----------------------------RUTAS DEL ENTRENAMIENTO-------------------------------------
# -----------------------------------------------------------------------------------------
# Rutas relativas desde la raíz del proyecto
# ¡¡WARNING!! PONER UNA BARRA AL FINAL DE LA RUTA
# -----------------------------------------------------------------------------------------
[RutasArchivos]
rutaCapturasTiempoRealPCAP = Capturas_tiempo_real/PCAPs/
rutaCapturasTiempoRealCSV = Capturas_tiempo_real/CSVs/
rutaSemiflujos =  Objetos preprocesados/Semiflujos/
rutaPesosXFMR = Objetos preprocesados/Pesos_TransformerSimple/
rutaPesosLSTM = Objetos preprocesados/Pesos_LSTM/
rutaConfigXFMR = Resultados/Resultados_TransformerSimple/Archivos de configuracion/
rutaConfigLSTM = Resultados/Resultados_LSTM/Archivos de configuracion/
